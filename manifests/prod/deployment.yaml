apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-deploy
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: my-app
        image: minhaz71/argocd-multicluster-demo:prod-2.0.0
        ports:
        - containerPort: 3000